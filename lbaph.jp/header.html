<style>
*{box-sizing:border-box;margin:0;padding:0}
.bounty-wrap{max-width:400px;margin:0 auto;padding:10px;font-family:'Hiragino Sans',sans-serif;background:#fff}

/* セクション */
.bounty-section{background:#fff;padding:15px;margin-bottom:10px;border:2px solid #333}
.bounty-title{font-size:14px;font-weight:bold;color:#333;margin-bottom:12px;text-align:center;border-bottom:2px solid #333;padding-bottom:8px}
.bounty-input{width:100%;padding:12px;border:2px solid #333;background:#fff;color:#333;font-size:14px;margin-bottom:10px}
.bounty-input:focus{border-color:#000;outline:none}
.bounty-input::placeholder{color:#999}
.bounty-btn{width:100%;padding:14px;font-size:14px;font-weight:bold;color:#fff;background:#333;border:none;cursor:pointer}
.bounty-btn:hover{background:#555}
.bounty-btn:disabled{background:#999;cursor:not-allowed}
.bounty-btn.danger{background:#e74c3c}
.bounty-btn.danger:hover{background:#c0392b}

/* タブ */
.tab-btns{display:flex;gap:5px;margin-bottom:15px}
.tab-btn{flex:1;padding:10px;font-size:12px;font-weight:bold;border:2px solid #333;background:#fff;color:#333;cursor:pointer}
.tab-btn.active{background:#333;color:#fff}

/* ビデオ画面 */
.video-section{display:none;position:relative;background:#000;min-height:70vh}
.video-section.show{display:block}
.video-section.ios-fullscreen{position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:100vw!important;height:100vh!important;min-height:100vh!important;z-index:2147483647!important}
.video-section.ios-fullscreen .remote-video{height:100vh!important}
.video-section.ios-fullscreen .local-video{bottom:10px!important}
.remote-video{width:100%;height:70vh;object-fit:cover;background:#222}
.local-video{position:absolute;bottom:10px;right:10px;width:120px;height:90px;object-fit:cover;border:2px solid #fff;border-radius:8px;background:#333;z-index:40}
.local-video.hidden{display:none}

/* ビデオコントロール（右上に縦並び） */
.video-controls{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:5px;z-index:100}
.ctrl-btn{width:40px;height:40px;border-radius:50%;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.95);color:#333;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.ctrl-btn:active{transform:scale(0.95)}
.ctrl-btn.danger{background:rgba(231,76,60,0.95);color:#fff}
.ctrl-btn.active{background:#2ecc71;color:#fff}

/* 接続状態 */
.connection-status{position:absolute;top:10px;left:10px;padding:8px 12px;border-radius:20px;font-size:12px;font-weight:bold;color:#fff}
.connection-status.connecting{background:#f39c12}
.connection-status.connected{background:#2ecc71}
.connection-status.disconnected{background:#e74c3c}

/* タイマー表示（右上から左に移動） */
.battle-timer{position:absolute;top:10px;right:60px;padding:8px 12px;border-radius:20px;font-size:14px;font-weight:bold;color:#fff;background:rgba(0,0,0,0.7);font-family:'Share Tech Mono',monospace}
.battle-timer.warning{background:#e74c3c;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}

/* 先攻/後攻表示 */
.turn-badge{position:absolute;top:50px;left:10px;padding:8px 16px;border-radius:4px;font-size:14px;font-weight:bold;color:#fff}
.turn-badge.first{background:#e74c3c}
.turn-badge.second{background:#3498db}

/* 準備画面オーバーレイ（タッチ可能、背景が見える） */
.prep-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:80px;z-index:45;pointer-events:none}
.prep-overlay.hidden{display:none}
.prep-content{background:rgba(0,0,0,0.7);padding:20px 30px;border-radius:12px;text-align:center;pointer-events:auto}
.prep-title{color:#ffd700;font-size:16px;font-weight:bold;margin-bottom:8px}
.prep-timer{color:#fff;font-size:36px;font-weight:bold;font-family:'Share Tech Mono',monospace}
.prep-turn{color:#fff;font-size:14px;margin-top:12px;padding:8px 16px;border-radius:6px}
.prep-turn.first{background:#e74c3c}
.prep-turn.second{background:#3498db}
.prep-hint{color:#fff;font-size:11px;margin-top:10px;opacity:0.9;line-height:1.5}

/* 終了警告オーバーレイ */
.end-warning{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(231,76,60,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60}
.end-warning.hidden{display:none}
.end-warning h2{color:#fff;font-size:24px;margin-bottom:10px}
.end-warning p{color:#fff;font-size:18px}
.end-warning .countdown{font-size:48px;font-weight:bold;color:#fff;font-family:'Share Tech Mono',monospace}

/* 待機モーダル */
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#fff;padding:30px;text-align:center;max-width:300px;width:90%}
.modal-content h2{font-size:16px;margin-bottom:15px}
.modal-content p{font-size:13px;color:#666;margin-bottom:20px}

/* スピナー */
.spinner{width:40px;height:40px;border:4px solid #ddd;border-top-color:#333;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 通知 */
.bounty-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;font-weight:bold;z-index:9999;display:none;border-radius:4px}
.bounty-toast.show{display:block;animation:fadeInOut 2.5s ease}
@keyframes fadeInOut{0%,100%{opacity:0}10%,90%{opacity:1}}

/* 島情報 */
.island-info{background:#fff;padding:5px;margin-bottom:10px;text-align:center;font-size:13px;border:2px solid #333}
.island-name{font-weight:bold;font-size:16px;color:#333}

/* ヘッダー画像（画面横幅いっぱいに配置） */
.header-image{width:100vw;position:relative;left:50%;transform:translateX(-50%);margin-bottom:5px;display:block}

/* 島グリッド */
.islands-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.island-card{background:#fff;border:2px solid #333;padding:12px 8px;text-align:center;cursor:pointer;transition:all 0.2s}
.island-card:hover{background:#f5f5f5;transform:scale(1.02)}
.island-card.selected{background:#333;color:#fff}
.island-card .island-title{font-size:14px;font-weight:bold;margin-bottom:4px}
.island-card .island-desc{font-size:10px;color:#666}
.island-card.selected .island-desc{color:#ccc}

/* ボタン横並び */
.btn-row{display:flex;gap:8px}

.btn-row .btn-sub{flex:3;background:#999}
.btn-row .btn-sub:hover{background:#777}

/* 非表示 */
.hidden{display:none!important}

<script>
// ===== Firebase設定 =====
var firebaseConfig = {
  apiKey: "AIzaSyDo4lHXDtFc1eaG-RJiGj0q5PioTzYpMWE",
  authDomain: "onepiece-web-a1c05.firebaseapp.com",
  projectId: "onepiece-web-a1c05",
  storageBucket: "onepiece-web-a1c05.firebasestorage.app",
  messagingSenderId: "977136307911",
  appId: "1:977136307911:web:5a1989e8b6373bf7d4f8e2"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

// ===== ICE Servers (STUN + TURN) =====
var ICE_SERVERS = [
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'},
  {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
];
var STUN_SERVERS = ICE_SERVERS; // 互換性のため

// ===== 状態管理 =====
var currentUser = null;
var currentIsland = null;
var battleId = null;
var isCreator = false;
var peerConnection = null;
var localStream = null;
var remoteStream = null;
var isMuted = false;
var isLocalVideoVisible = false;
var isFrontCamera = false; // 現在前面カメラか
var isFullscreenMode = false; // iOS用フルスクリーン状態

// Firebase subscriptions
var islandUnsubscribe = null;
var signalingUnsubscribe = null;
var iceCandidatesUnsubscribe = null;

// タイマー関連
var prepTimerInterval = null;
var battleTimerInterval = null;
var endTimerInterval = null;
var battleTimeRemaining = 30 * 60; // 30分（秒）
var prepTimeRemaining = 90; // 90秒
var isFirstPlayer = false; // 先攻かどうか
var battleStartTime = null; // 戦闘開始時刻（復帰用）

// ===== ユーティリティ =====
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2500);
}

function showTab(tab){
  document.querySelectorAll('.tab-btn').forEach(function(b,i){
    b.classList.toggle('active',(tab==='login'&&i===0)||(tab==='register'&&i===1));
  });
  document.getElementById('loginTab').style.display=tab==='login'?'block':'none';
  document.getElementById('registerTab').style.display=tab==='register'?'block':'none';
}

function generateUserId(){
  return 'user_'+Math.random().toString(36).substr(2,8);
}

// ===== Firebase操作 =====
function generateBattleId(){
  return 'battle_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
}

// 島のステータスを取得
async function getIsland(islandId){
  var doc = await db.collection('islands').doc(islandId).get();
  if(doc.exists){
    return {id: doc.id, ...doc.data()};
  }
  return null;
}

// 島に入室（待機開始）
async function enterIslandFirebase(islandId, userId){
  await db.collection('islands').doc(islandId).set({
    status: 'waiting',
    waitingUser: userId,
    users: [userId],
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge: true});
  console.log('Entered island:', islandId);
}

// 島から退出
async function leaveIslandFirebase(islandId, userId){
  var doc = await db.collection('islands').doc(islandId).get();
  if(doc.exists && doc.data().waitingUser === userId){
    await db.collection('islands').doc(islandId).update({
      status: 'empty',
      waitingUser: null,
      users: []
    });
    console.log('Left island:', islandId);
  }
}

// バトル作成
async function createBattleFirebase(islandId, creatorId, joinerId){
  var newBattleId = generateBattleId();

  await db.collection('battles').doc(newBattleId).set({
    islandId: islandId,
    creatorId: creatorId,
    joinerId: joinerId,
    status: 'connecting',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  await db.collection('islands').doc(islandId).update({
    status: 'in_battle',
    users: [creatorId, joinerId],
    currentBattleId: newBattleId
  });

  console.log('Battle created:', newBattleId);
  return newBattleId;
}

// 島の変更を監視
function subscribeToIsland(islandId, callback){
  return db.collection('islands').doc(islandId).onSnapshot(function(doc){
    if(doc.exists){
      callback({id: doc.id, ...doc.data()});
    }
  });
}

// SDP Offer書き込み
async function writeOfferFirebase(battleId, sdp, userId){
  await db.collection('signaling').doc(battleId).set({
    offer: {
      sdp: sdp,
      type: 'offer',
      fromUserId: userId,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }
  }, {merge: true});
  console.log('Offer written');
}

// SDP Answer書き込み
async function writeAnswerFirebase(battleId, sdp, userId){
  await db.collection('signaling').doc(battleId).set({
    answer: {
      sdp: sdp,
      type: 'answer',
      fromUserId: userId,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }
  }, {merge: true});
  console.log('Answer written');
}

// Offer監視
function subscribeToOffer(battleId, callback){
  return db.collection('signaling').doc(battleId).onSnapshot(function(doc){
    if(doc.exists && doc.data().offer){
      callback(doc.data().offer);
    }
  });
}

// Answer監視
function subscribeToAnswer(battleId, callback){
  return db.collection('signaling').doc(battleId).onSnapshot(function(doc){
    if(doc.exists && doc.data().answer){
      callback(doc.data().answer);
    }
  });
}

// ICE Candidate書き込み
async function writeIceCandidateFirebase(battleId, candidate, userId){
  await db.collection('signaling').doc(battleId)
    .collection('iceCandidates').add({
      candidate: candidate.candidate,
      sdpMid: candidate.sdpMid,
      sdpMLineIndex: candidate.sdpMLineIndex,
      fromUserId: userId,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
}

// ICE Candidates監視
function subscribeToIceCandidates(battleId, excludeUserId, callback){
  return db.collection('signaling').doc(battleId)
    .collection('iceCandidates')
    .where('fromUserId', '!=', excludeUserId)
    .onSnapshot(function(snapshot){
      snapshot.docChanges().forEach(function(change){
        if(change.type === 'added'){
          var data = change.doc.data();
          callback({
            candidate: data.candidate,
            sdpMid: data.sdpMid,
            sdpMLineIndex: data.sdpMLineIndex
          });
        }
      });
    });
}

// バトル終了
async function endBattleFirebase(battleId, islandId){
  try {
    await db.collection('battles').doc(battleId).update({
      status: 'ended',
      endedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('islands').doc(islandId).update({
      status: 'empty',
      waitingUser: null,
      users: [],
      currentBattleId: null
    });
    console.log('Battle ended:', battleId);
  } catch(e) {
    console.error('Error ending battle:', e);
  }
}

// Subscriptionクリーンアップ
function cleanupSubscriptions(){
  if(islandUnsubscribe){ islandUnsubscribe(); islandUnsubscribe = null; }
  if(signalingUnsubscribe){ signalingUnsubscribe(); signalingUnsubscribe = null; }
  if(iceCandidatesUnsubscribe){ iceCandidatesUnsubscribe(); iceCandidatesUnsubscribe = null; }
}

// ===== GAS API通信（認証のみ）=====
var GAS_URL = 'https://script.google.com/macros/s/AKfycby4z8OF9_mAAFa4GjX9p1C-32Aa3ZRJk1S0rQ3mP8H3C_HnWymId12ZqhYBPLReY5cvfw/exec';

function callAPI(params,callback){
  var isGet = !params.action || ['getIsland','getSignaling','getIceCandidates'].includes(params.action);
  var url = GAS_URL;
  var options = {};

  if(isGet || params._method==='GET'){
    delete params._method;
    url += '?' + Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k])}).join('&');
    options.method = 'GET';
  } else {
    options.method = 'POST';
    options.headers = {'Content-Type':'text/plain'};
    options.body = JSON.stringify(params);
  }

  fetch(url,options)
    .then(function(r){return r.json()})
    .then(callback)
    .catch(function(e){showToast('通信エラー');console.error(e);});
}

// ===== 認証 =====
function register(){
  var id=document.getElementById('regId').value.trim().toLowerCase();
  var pw=document.getElementById('regPw').value;
  var name=document.getElementById('regName').value.trim();
  if(!id||!pw||!name){showToast('全項目入力してください');return;}
  if(!/^[a-z0-9]+$/.test(id)){showToast('IDは英数字のみ');return;}

  document.getElementById('regBtn').disabled=true;
  callAPI({action:'register',userId:id,password:pw,displayName:name},function(r){
    document.getElementById('regBtn').disabled=false;
    if(r.success){
      showToast('登録完了！ログインしてください');
      showTab('login');

// ===== 島（コード）入室 =====
async function enterIsland(){
  var entryCode = document.getElementById('couponInput').value.trim().toUpperCase();

  // コードのみ必要（島選択は不要）
  if(!entryCode){showToast('コードを入力してください');return;}
  if(entryCode.length < 3){showToast('コードは3文字以上で入力してください');return;}

  // コード=島ID（プレフィックス追加で他システムと衝突防止）
  var islandId = 'LBAPH_' + entryCode;
  console.log('Entering island:', islandId);

  try {
    // Firebase経由で島の状態を確認
    var island = await getIsland(islandId);
    console.log('Island status:', island);

    if(!island || island.status === 'empty'){
      // 誰もいない→1人目として待機開始
      await startWaitingFirebase(islandId);
    } else if(island.status === 'waiting'){
      if(island.waitingUser === currentUser.id){
        // 自分が待機中→再入室
        await startWaitingFirebase(islandId);
      } else {
        // 他の人が待機中→2人目として参加、バトル開始
        await joinBattleFirebase(islandId, island.waitingUser);
      }
    } else if(island.status === 'in_battle'){
      // 対戦中→自分が参加者かチェック
      await checkAndRejoinBattleFirebase(island.currentBattleId, islandId);
    } else {
      showToast('このコードは現在使用できません');
    }
  } catch(e) {
    console.error('Error entering island:', e);
    showToast('エラーが発生しました');
  }
}

// バトル中の島に自分が参加者かチェックして復帰（Firebase版）
async function checkAndRejoinBattleFirebase(battleIdToCheck, islandId){
  console.log('Checking battle:', battleIdToCheck, 'currentUser:', currentUser.id);

  try {
    var battleDoc = await db.collection('battles').doc(battleIdToCheck).get();

    if(battleDoc.exists){
      var battle = battleDoc.data();
      console.log('Battle data:', battle);

      if(battle.status !== 'ended'){
        var myId = String(currentUser.id).toLowerCase();
        var creatorId = String(battle.creatorId || '').toLowerCase();
        var joinerId = String(battle.joinerId || '').toLowerCase();

        if(creatorId === myId || joinerId === myId){
          battleId = battleIdToCheck;
          currentIsland = {id: islandId};
          isCreator = (creatorId === myId);
          console.log('User is participant, isCreator:', isCreator);
          showToast('バトルに復帰します...');
          startVideoCall();
        } else {
          showToast('このコードは対戦中です');
        }
      } else {
        showToast('このコードは対戦中です');
      }
    } else {
      showToast('このコードは対戦中です');
    }
  } catch(e) {
    console.error('Error checking battle:', e);
    showToast('エラーが発生しました');
  }
}

// ===== WebRTC =====
async function startVideoCall(){
  document.getElementById('loginHeaderImage').classList.add('hidden');
  document.getElementById('headerImage').classList.add('hidden');
  document.getElementById('couponSection').classList.add('hidden');
  document.getElementById('videoSection').classList.add('show');
  document.getElementById('prepOverlay').classList.remove('hidden');
  document.getElementById('endWarning').classList.add('hidden');
  document.getElementById('resumeBtn').style.display = 'none';
  updateConnectionStatus('connecting');

  // 先攻/後攻を設定（先に待っていた人=Creator が先攻）
  setTurnOrder(isCreator);

  try{
    // 背面カメラ・広角を取得（準備タイマーの前に）
    localStream = await getBackCamera();
    document.getElementById('localVideo').srcObject = localStream;

    // 準備タイマー開始（カメラ取得後）
    startPrepTimer();

    // PeerConnection作成
    createPeerConnection();

    if(isCreator){
      // Offer作成 → Firebase書き込み
      var offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      await writeOfferFirebase(battleId, offer.sdp, currentUser.id);

      // Answer監視（Firebase realtime）
      signalingUnsubscribe = subscribeToAnswer(battleId, async function(answer){
        if(answer && answer.sdp && peerConnection.signalingState !== 'stable'){
          console.log('Answer received');
          await peerConnection.setRemoteDescription(new RTCSessionDescription({type:'answer', sdp:answer.sdp}));
        }
      });
    } else {
      // Offer監視 → Answer返す（Firebase realtime）
      signalingUnsubscribe = subscribeToOffer(battleId, async function(offer){
        if(offer && offer.sdp && !peerConnection.remoteDescription){
          console.log('Offer received');
          await peerConnection.setRemoteDescription(new RTCSessionDescription({type:'offer', sdp:offer.sdp}));
          var answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          await writeAnswerFirebase(battleId, answer.sdp, currentUser.id);
        }
      });
    }

    // ICE候補監視（Firebase realtime）
    iceCandidatesUnsubscribe = subscribeToIceCandidates(battleId, currentUser.id, function(candidate){
      if(peerConnection && peerConnection.remoteDescription){
        peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      }
    });

  }catch(e){
    showToast('カメラエラー: '+e.message);
    console.error(e);
  }
}

async function getBackCamera(){
  console.log('カメラ取得開始...');

  // まずカメラ権限を取得
  try {
    await navigator.mediaDevices.getUserMedia({video:true, audio:true});
  } catch(e) {
    console.log('初回権限取得:', e.message);
  }

  var devices = await navigator.mediaDevices.enumerateDevices();
  var videoDevices = devices.filter(function(d){return d.kind==='videoinput'});
  console.log('利用可能なカメラ:', videoDevices.length);
  videoDevices.forEach(function(d,i){
    console.log(i + ': ' + d.label);
  });

  // 広角カメラを優先（"wide"や"ultra"を含むものを探す）
  var wideCamera = videoDevices.find(function(d){
    var label = d.label.toLowerCase();
    return label.includes('wide') || label.includes('ultra') || label.includes('広角');
  });

  // 試行順序: 広角 → 背面 → 任意
  var attempts = [];

  if(wideCamera){
    attempts.push({
      video: {deviceId:{exact:wideCamera.deviceId}, width:{ideal:1280}, height:{ideal:720}},
      audio: true
    });
  }

  attempts.push({
    video: {facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}},
    audio: true
  });

  attempts.push({
    video: {width:{ideal:1280}, height:{ideal:720}},
    audio: true
  });

  attempts.push({
    video: true,
    audio: true
  });

  for(var i = 0; i < attempts.length; i++){
    try {
      console.log('カメラ取得試行 ' + (i+1) + ':', JSON.stringify(attempts[i].video));
      var stream = await navigator.mediaDevices.getUserMedia(attempts[i]);
      console.log('カメラ取得成功');
      return stream;
    } catch(e) {
      console.log('カメラ取得失敗 ' + (i+1) + ':', e.message);
    }
  }

  throw new Error('カメラを取得できませんでした');
}

function createPeerConnection(){
  peerConnection=new RTCPeerConnection({iceServers:STUN_SERVERS});

  localStream.getTracks().forEach(function(track){
    peerConnection.addTrack(track,localStream);
  });

  peerConnection.ontrack=function(e){
    console.log('Remote track received:', e.track.kind);
    console.log('Remote streams:', e.streams.length);

    if(e.streams && e.streams[0]){
      remoteStream = e.streams[0];
      var remoteVideo = document.getElementById('remoteVideo');
      remoteVideo.srcObject = remoteStream;

      // ビデオ再生を試行
      remoteVideo.play().catch(function(err){
        console.log('Auto-play blocked, user interaction needed:', err);
      });

      // トラック情報
      var videoTracks = remoteStream.getVideoTracks();
      var audioTracks = remoteStream.getAudioTracks();
      console.log('Remote video tracks:', videoTracks.length);
      console.log('Remote audio tracks:', audioTracks.length);
    }
  };

  peerConnection.onicecandidate=function(e){
    if(e.candidate){
      writeIceCandidateFirebase(battleId, e.candidate, currentUser.id);
    }
  };

  peerConnection.onconnectionstatechange=function(){
    console.log('Connection state:',peerConnection.connectionState);
    if(peerConnection.connectionState==='connected'){
      updateConnectionStatus('connected');
    }else if(peerConnection.connectionState==='disconnected'||peerConnection.connectionState==='failed'){
      updateConnectionStatus('disconnected');
    }
  };
}

function updateConnectionStatus(status){
  var el=document.getElementById('connStatus');
  el.className='connection-status '+status;
  if(status==='connecting')el.textContent='接続中...';
  else if(status==='connected')el.textContent='接続済み';
  else el.textContent='切断';
}

// カメラ切り替え（背面↔前面）
async function switchCamera(){
  if(!localStream) return;

  var newFacingMode = isFrontCamera ? 'environment' : 'user';

  try {
    // 現在のビデオトラックを停止
    localStream.getVideoTracks().forEach(function(t){t.stop()});

    // 新しいカメラでストリーム取得
    var newStream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: newFacingMode, width:{ideal:1280}, height:{ideal:720}},
      audio: false
    });

    var newVideoTrack = newStream.getVideoTracks()[0];

    // ローカルストリームのビデオトラックを置き換え
    var oldVideoTrack = localStream.getVideoTracks()[0];
    if(oldVideoTrack){
      localStream.removeTrack(oldVideoTrack);
    }
    localStream.addTrack(newVideoTrack);

    // PeerConnectionのトラックも置き換え
    if(peerConnection){
      var senders = peerConnection.getSenders();
      var videoSender = senders.find(function(s){return s.track && s.track.kind === 'video'});
      if(videoSender){
        await videoSender.replaceTrack(newVideoTrack);
      }
    }

    // ローカルビデオ更新
    document.getElementById('localVideo').srcObject = localStream;

    isFrontCamera = !isFrontCamera;
    document.getElementById('btnSwitchCamera').classList.toggle('active', isFrontCamera);
    showToast(isFrontCamera ? '前面カメラ' : '背面カメラ');

  } catch(e) {
    console.error('カメラ切替エラー:', e);
    showToast('カメラ切替に失敗');
  }
}

// ダブルタップ用変数
var lastTap = 0;
var eventsInitialized = false;

// イベントを設定する関数
function setupVideoEvents(){
  if(eventsInitialized) return;

  var remoteVideo = document.getElementById('remoteVideo');
  var videoSection = document.getElementById('videoSection');

  if(!remoteVideo || !videoSection){
    console.error('Video elements not found');
    return;
  }

  console.log('Setting up video events');

  // タッチイベント（スマホ）- ダブルタップで全画面
  remoteVideo.addEventListener('touchend', function(e){
    var currentTime = new Date().getTime();
    var tapLength = currentTime - lastTap;
    console.log('Touch detected, tapLength:', tapLength);
    if(tapLength < 300 && tapLength > 0){
      e.preventDefault();
      console.log('Double tap detected!');
      toggleFullscreen();
    }
    lastTap = currentTime;
    tryPlayVideos();
  }, {passive: false});

  // ダブルクリック（PC）
  remoteVideo.addEventListener('dblclick', function(e){
    console.log('Double click detected!');
    e.preventDefault();
    toggleFullscreen();
  });

  // 画面タッチでビデオ再生を試行
  videoSection.addEventListener('click', function(){
    tryPlayVideos();
  });

  // ===== ボタンイベントハンドラー設定 =====
  var btnFullscreen = document.getElementById('btnFullscreen');
  var btnSwitchCamera = document.getElementById('btnSwitchCamera');
  var btnToggleLocal = document.getElementById('btnToggleLocal');
  var btnMute = document.getElementById('btnMute');
  var btnExit = document.getElementById('btnExit');

  // 全画面ボタン
  if(btnFullscreen){
    btnFullscreen.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      console.log('Fullscreen button clicked');
      toggleFullscreen();
    });
    btnFullscreen.addEventListener('touchend', function(e){
      e.preventDefault();
      e.stopPropagation();
      console.log('Fullscreen button touched');
      toggleFullscreen();
    }, {passive: false});
  }

  // カメラ切替ボタン
  if(btnSwitchCamera){
    btnSwitchCamera.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      switchCamera();
    });
    btnSwitchCamera.addEventListener('touchend', function(e){
      e.preventDefault();
      e.stopPropagation();
      switchCamera();
    }, {passive: false});
  }

  // 自分映像表示ボタン
  if(btnToggleLocal){
    btnToggleLocal.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      toggleLocalVideo();
    });
    btnToggleLocal.addEventListener('touchend', function(e){
      e.preventDefault();
      e.stopPropagation();
      toggleLocalVideo();
    }, {passive: false});
  }

  // ミュートボタン
  if(btnMute){
    btnMute.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      toggleMute();
    });
    btnMute.addEventListener('touchend', function(e){
      e.preventDefault();
      e.stopPropagation();
      toggleMute();
    }, {passive: false});
  }

  // 退出ボタン
  if(btnExit){
    btnExit.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      console.log('Exit button clicked');
      confirmExit();
    });
    btnExit.addEventListener('touchend', function(e){
      e.preventDefault();
      e.stopPropagation();
      console.log('Exit button touched');
      confirmExit();
    }, {passive: false});
  }

  // フルスクリーン変更イベント
  document.addEventListener('fullscreenchange', function(){
    var btn = document.getElementById('btnFullscreen');
    if(btn){
      btn.classList.toggle('active', !!document.fullscreenElement);
    }
  });
  document.addEventListener('webkitfullscreenchange', function(){
    var btn = document.getElementById('btnFullscreen');
    if(btn){
      btn.classList.toggle('active', !!document.webkitFullscreenElement);
    }
  });

  eventsInitialized = true;
  console.log('Video events setup complete');
}

function tryPlayVideos(){
  var remoteVideo = document.getElementById('remoteVideo');
  var localVideo = document.getElementById('localVideo');
  if(remoteVideo.srcObject && remoteVideo.paused){
    remoteVideo.play().catch(function(e){console.log('Remote play error:', e)});
  }
  if(localVideo.srcObject && localVideo.paused){
    localVideo.play().catch(function(e){console.log('Local play error:', e)});
  }
}

// ===== タイマー管理 =====
function stopAllTimers(){
  if(prepTimerInterval){clearInterval(prepTimerInterval);prepTimerInterval=null;}
  if(battleTimerInterval){clearInterval(battleTimerInterval);battleTimerInterval=null;}
  if(endTimerInterval){clearInterval(endTimerInterval);endTimerInterval=null;}
}

function startPrepTimer(){
  prepTimeRemaining = 90;
  updatePrepDisplay();

  // 準備中も戦闘時と同じレイアウト（自分の映像を右下に小さく表示）
  document.getElementById('localVideo').classList.remove('hidden');
  isLocalVideoVisible = true;
  document.getElementById('btnToggleLocal').classList.add('active');

  prepTimerInterval = setInterval(function(){
    prepTimeRemaining--;
    updatePrepDisplay();

    if(prepTimeRemaining <= 0){
      clearInterval(prepTimerInterval);
      prepTimerInterval = null;
      document.getElementById('prepOverlay').classList.add('hidden');
      startBattleTimer();
    }
  }, 1000);
}

function updatePrepDisplay(){
  document.getElementById('prepTimer').textContent = prepTimeRemaining;
}

function startBattleTimer(){
  // 戦闘開始時刻を記録（復帰用）
  if(!battleStartTime){
    battleStartTime = Date.now();
    saveBattleSession();
  }

  battleTimeRemaining = 30 * 60; // 30分
  updateBattleTimerDisplay();

  battleTimerInterval = setInterval(function(){
    battleTimeRemaining--;
    updateBattleTimerDisplay();

    // 残り60秒で警告
    if(battleTimeRemaining === 60){
      document.getElementById('battleTimer').classList.add('warning');
      showEndWarning();
    }

    // 時間切れ
    if(battleTimeRemaining <= 0){
      clearInterval(battleTimerInterval);
      battleTimerInterval = null;
      forceEndCall();
    }
  }, 1000);
}

function updateBattleTimerDisplay(){
  var mins = Math.floor(battleTimeRemaining / 60);
  var secs = battleTimeRemaining % 60;
  var display = String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
  document.getElementById('battleTimer').textContent = display;
}

function showEndWarning(){
  document.getElementById('endWarning').classList.remove('hidden');
  var endCountdown = 60;
  document.getElementById('endCountdown').textContent = endCountdown;

  endTimerInterval = setInterval(function(){
    endCountdown--;
    document.getElementById('endCountdown').textContent = endCountdown;

    if(endCountdown <= 0){
      clearInterval(endTimerInterval);
      endTimerInterval = null;
    }
  }, 1000);
}

function forceEndCall(){
  showToast('戦闘時間終了！');
  endCall();
}

// ===== セッション保存・復帰 =====
function saveBattleSession(){
  var session = {
    battleId: battleId,
    islandId: currentIsland ? currentIsland.id : null,
    isCreator: isCreator,
    battleStartTime: battleStartTime
  };
  sessionStorage.setItem('bountyBattle', JSON.stringify(session));
}

function clearBattleSession(){
  sessionStorage.removeItem('bountyBattle');
  battleStartTime = null;
}

function tryResumeBattle(){
  var saved = sessionStorage.getItem('bountyBattle');
  if(!saved) return false;

  var session = JSON.parse(saved);

  // 30分経過していたら復帰不可
  var elapsed = Date.now() - session.battleStartTime;
  if(elapsed >= 30 * 60 * 1000){
    clearBattleSession();
    showToast('戦闘時間が終了しています');
    return false;
  }

  // 復帰
  battleId = session.battleId;
  currentIsland = {id: session.islandId};
  isCreator = session.isCreator;
  battleStartTime = session.battleStartTime;

  // 残り時間を計算
  var remainingMs = (30 * 60 * 1000) - elapsed;
  battleTimeRemaining = Math.floor(remainingMs / 1000);

  showToast('バトルに復帰します...');
  resumeVideoCall();
  return true;
}

async function resumeVideoCall(){
  document.getElementById('loginHeaderImage').classList.add('hidden');
  document.getElementById('headerImage').classList.add('hidden');
  document.getElementById('couponSection').classList.add('hidden');
  document.getElementById('videoSection').classList.add('show');
  document.getElementById('prepOverlay').classList.add('hidden'); // 準備画面スキップ
  document.getElementById('endWarning').classList.add('hidden');
  document.getElementById('resumeBtn').style.display = 'none';
  updateConnectionStatus('connecting');

  // 先攻/後攻を設定
  setTurnOrder(isCreator);

  // カメラ状態リセット
  isFrontCamera = false;

  try{
    localStream = await getBackCamera();
    document.getElementById('localVideo').srcObject = localStream;

    // 自分の映像を表示
    document.getElementById('localVideo').classList.remove('hidden');
    isLocalVideoVisible = true;
    document.getElementById('btnToggleLocal').classList.add('active');

    createPeerConnection();

    if(isCreator){
      // Offer作成 → Firebase書き込み
      var offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      await writeOfferFirebase(battleId, offer.sdp, currentUser.id);

      // Answer監視（Firebase realtime）
      signalingUnsubscribe = subscribeToAnswer(battleId, async function(answer){
        if(answer && answer.sdp && peerConnection.signalingState !== 'stable'){
          console.log('Answer received');
          await peerConnection.setRemoteDescription(new RTCSessionDescription({type:'answer', sdp:answer.sdp}));
        }
      });
    } else {
      // Offer監視 → Answer返す（Firebase realtime）
      signalingUnsubscribe = subscribeToOffer(battleId, async function(offer){
        if(offer && offer.sdp && !peerConnection.remoteDescription){
          console.log('Offer received');
          await peerConnection.setRemoteDescription(new RTCSessionDescription({type:'offer', sdp:offer.sdp}));
          var answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          await writeAnswerFirebase(battleId, answer.sdp, currentUser.id);
        }
      });
    }

    // ICE候補監視（Firebase realtime）
    iceCandidatesUnsubscribe = subscribeToIceCandidates(battleId, currentUser.id, function(candidate){
      if(peerConnection && peerConnection.remoteDescription){
        peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      }
    });

    // 残り時間を計算してタイマー再開
    var elapsed = Date.now() - battleStartTime;
    var remainingMs = (30 * 60 * 1000) - elapsed;
    battleTimeRemaining = Math.max(0, Math.floor(remainingMs / 1000));
    updateBattleTimerDisplay();

    // バトルタイマー開始（カウントダウン継続）
    battleTimerInterval = setInterval(function(){
      battleTimeRemaining--;
      updateBattleTimerDisplay();

      if(battleTimeRemaining === 60){
        document.getElementById('battleTimer').classList.add('warning');
        showEndWarning();
      }

      if(battleTimeRemaining <= 0){
        clearInterval(battleTimerInterval);
        battleTimerInterval = null;
        forceEndCall();
      }
    }, 1000);

  }catch(e){
    showToast('カメラエラー: '+e.message);
    console.error(e);
  }
}

// ===== 先攻/後攻設定 =====
function setTurnOrder(isFirst){
  isFirstPlayer = isFirst;
  var turnBadge = document.getElementById('turnBadge');
  var prepTurn = document.getElementById('prepTurn');

  if(isFirst){
    turnBadge.textContent = '先攻';
    turnBadge.className = 'turn-badge first';
    prepTurn.textContent = 'あなたは先攻です';
    prepTurn.className = 'prep-turn first';
  }else{
    turnBadge.textContent = '後攻';
    turnBadge.className = 'turn-badge second';
    prepTurn.textContent = 'あなたは後攻です';
    prepTurn.className = 'prep-turn second';
  }
}

// ===== 初期化 =====
function initApp(){
  console.log('App initializing...');

  // ビデオ関連イベントを設定
  setupVideoEvents();

  var saved=sessionStorage.getItem('bountyUser');
  if(saved){
    currentUser=JSON.parse(saved);
    showCouponSection();

    // バトルセッションがあれば復帰ボタンを表示
    var battleSession = sessionStorage.getItem('bountyBattle');
    if(battleSession){
      var session = JSON.parse(battleSession);
      var elapsed = Date.now() - session.battleStartTime;
      if(elapsed < 30 * 60 * 1000){
        document.getElementById('resumeBtn').style.display = 'block';
        var remaining = Math.floor((30 * 60 * 1000 - elapsed) / 1000 / 60);
        document.getElementById('resumeBtn').textContent = 'バトルに戻る（残り約' + remaining + '分）';
      }else{
        sessionStorage.removeItem('bountyBattle');
      }
    }
  }

  console.log('App initialized');
}

// DOMContentLoadedで初期化
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initApp);
}else{
  initApp();
}
</script>
